<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cours Linux gratuit en français - LinuxDojo</title>
    <meta name="description" content="Cours Linux gratuit en français : 12 chapitres pratiques, exercices et CTF pour maîtriser l'admin système, le DevOps et la cybersécurité. Sans inscription.">
    <link rel="canonical" href="https://linuxdojo.widal.dev/">

    <link rel="alternate" hreflang="fr" href="https://linuxdojo.widal.dev/fr/">
    <link rel="alternate" hreflang="en" href="https://linuxdojo.widal.dev/eng/">
    <link rel="alternate" hreflang="x-default" href="https://linuxdojo.widal.dev/">

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

    {% include analytics.html %}

    <script>
    // Redirection selon la langue du navigateur ; français par défaut.
    (function () {
        var lang = 'fr';
        var prefs = navigator.languages || [navigator.language || ''];
        for (var i = 0; i < prefs.length; i++) {
            var p = (prefs[i] || '').toLowerCase();
            if (p.indexOf('fr') === 0) { lang = 'fr'; break; }
            if (p.indexOf('en') === 0) { lang = 'en'; break; }
        }
        location.replace(lang === 'en' ? '/eng/' : '/fr/');
    })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/fr/"></noscript>
</head>
<body>
    <p><a href="/fr/">Cours Linux en français</a> &middot; <a href="/eng/">Linux course in English</a></p>
</body>
</html>
